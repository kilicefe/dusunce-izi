name: Pilot verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dusunce_test
          POSTGRES_PASSWORD: dusunce_test_password
          POSTGRES_DB: dusunce_izi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dusunce_test -d dusunce_izi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://dusunce_test:dusunce_test_password@localhost:5432/dusunce_izi_test
      DIRECT_URL: postgresql://dusunce_test:dusunce_test_password@localhost:5432/dusunce_izi_test
      AUTH_SECRET: ci-only-auth-secret-that-is-never-used-in-production
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-placeholder-secret
      ENABLE_TEST_AUTH: 'true'
      E2E_TEST_PASSWORD: pilot-e2e-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed synthetic pilot data
        run: npx prisma db seed

      - name: Type check
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npx playwright test --reporter=line

      - name: Upload synthetic navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-screenshots
          path: test-results/**/navigation-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
